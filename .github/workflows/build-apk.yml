name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon -PciVersionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrailGuide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Read version from Gradle
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VN=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VC=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "tag=v${VN}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "## Trail Guide ${{ steps.version.outputs.name }}"
            echo ""
            echo "**Build:** ${{ github.run_number }}  "
            echo "**Version code:** ${{ steps.version.outputs.code }}  "
            echo "**Commit:** ${GITHUB_SHA::7}  "
            echo ""
            echo "### What's in this build"
            echo ""
            # Commits since previous tag, or last 15 commits
            if git describe --tags --abbrev=0 2>/dev/null; then
              PREV=$(git describe --tags --abbrev=0)
              echo "Changes since \`$PREV\`:"
              echo ""
              git log "$PREV"..HEAD --pretty=format:"- %s (%h)" | head -40
            else
              echo "Recent commits:"
              echo ""
              git log -15 --pretty=format:"- %s (%h)"
            fi
            echo ""
            echo ""
            echo "### Install"
            echo "1. Download \`app-debug.apk\` from the assets below"
            echo "2. On your phone, open the file and allow install from this source"
            echo "3. Grant **Location** when the app asks"
            echo ""
            echo "### Notes"
            echo "- Debug build (suitable for personal use)"
            echo "- Optional Mapbox token in Settings for RDR2-style map"
            echo "- Free map works without a key (OpenFreeMap)"
          } > /tmp/release-body.md
          echo "path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Trail Guide ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          body_path: /tmp/release-body.md
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When a manual/formal release is published, attach APK too
      - name: Attach APK to existing Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
